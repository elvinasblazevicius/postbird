# Checks every push and pull request: types, lint, unit tests, and the
# database integration tests against a throwaway PostgreSQL container.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postbird
          POSTGRES_PASSWORD: postbird
          POSTGRES_DB: postbird_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postbird -d postbird_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values: the database lives only for this job.
      DATABASE_URL: postgres://postbird:postbird@localhost:5432/postbird_test
      TEST_DATABASE_URL: postgres://postbird:postbird@localhost:5432/postbird_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Known vulnerabilities in the packages the site runs (not dev tools): fails on high or
      # critical only; moderate and low ones are listed in the log without failing the build.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src tests scripts
      - name: Database migrations
        run: npm run db:migrate
      - name: Unit and integration tests
        run: npm test
