# Backup for applying database migrations (db/migrations): the Netlify production
# build applies them before the new code goes live (scripts/build-netlify.sh);
# this applies them again once CI has passed on main, in case that build couldn't
# (e.g. DATABASE_URL without the Builds scope). Safe to run more than once
# (already-applied ones are skipped). The scheduled workflow also applies them
# when CI passed for its commit. Can be started by hand (Actions → Deploy
# migrations → Run workflow).
#
# Repository secret needed: DATABASE_URL (the same one the scheduled jobs use).
name: Deploy migrations

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Reads the repository only; no token permissions beyond that.
permissions:
  contents: read

concurrency:
  group: deploy-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # Only after CI succeeded for a push to main (not a pull request's run), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI checked (a workflow_run otherwise checks out the latest main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret."; exit 1; fi
          npm run db:migrate
