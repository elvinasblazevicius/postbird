# Applies new database migrations (db/migrations) once CI has passed on main,
# so the database is ready for the code Netlify is deploying from the same push
# and a migration from a commit that failed its checks is never applied.
# Migrations are safe to run more than once (already-applied ones are
# skipped); the scheduled workflow applies them again before each task.
# Can also be started by hand (Actions → Deploy migrations → Run workflow).
#
# Repository secret needed: DATABASE_URL (the same one the scheduled jobs use).
name: Deploy migrations

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Reads the repository only; no token permissions beyond that.
permissions:
  contents: read

concurrency:
  group: deploy-migrate
  cancel-in-progress: false

jobs:
  migrate:
    # Only after CI succeeded for a push to main (not a pull request's run), or when started by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commit CI checked (a workflow_run otherwise checks out the latest main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret."; exit 1; fi
          npm run db:migrate
