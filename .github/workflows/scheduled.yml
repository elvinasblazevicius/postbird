# Runs the vacancy import every 2 hours and the emails once a day,
# directly against the database (no website time limits, works on any host).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   DATABASE_URL     same value as on your host
#   CRON_SECRET, ANALYTICS_SALT
#                    required; use exactly the same values on Netlify and in GitHub. They key
#                    the one-way trial markers written here and checked by the site (README Step 4).
#   SITE_URL         your site's address, e.g. https://postbirdjobs.com (used in email links)
#   RESEND_API_KEY   (optional until email is set up)
#   EMAIL_FROM       (optional) e.g. Postbird <alerts@yourdomain.com>
#   INOREADER_FEED_URLS (optional) same as on your host
#   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN, NEXT_PUBLIC_PADDLE_PRICE_MONTHLY, NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY
#                    (optional, once billing is live) same as on your host: the free
#                    weekly email then offers the free trial instead of early access
#   PADDLE_API_KEY, NEXT_PUBLIC_PADDLE_ENV
#                    (required once billing is live) same as on your host: the daily run
#                    cancels free trials at addresses nobody confirmed before they turn
#                    into a payment, and retries Paddle cancels that failed (README Step 4)
name: Scheduled jobs

on:
  schedule:
    - cron: "17 */2 * * *"   # import feeds every 2 hours (UTC)
    # Emails, daily 06:23 UTC: paid alerts (each subscriber's daily or weekly
    # choice is enforced in the code, so weekly subscribers get one email a
    # week) and the free weekly email, which starts on Mondays (UTC), or on
    # Tuesday or Wednesday if no run started it on Monday, and goes to each
    # free subscriber at most once per ISO week; later runs only retry a week
    # that started and failed.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: sync
        type: choice
        options: [sync, digest, setup, diagnose, sources, feed-coverage, tidy-jobs-dry-run, tidy-jobs, copy-database, ai-fill-trial]

# actions: read lets the job check that CI passed for this commit before it applies migrations.
permissions:
  contents: read
  actions: read

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Migrations are applied by the Netlify production build and the Deploy migrations workflow.
      # Here only as a catch-up, and only when the latest CI run for this commit succeeded, so a
      # migration from a commit that failed its checks is never applied.
      - name: Check CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""' 2>/dev/null || true)
          if [ "$conclusion" = "success" ]; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI hasn't succeeded for this commit (${conclusion:-no run found}), so migrations are not applied by this run."
          fi
      # The import reads vacancy pages built with JavaScript with a headless browser (src/lib/feeds/rendered-page.ts).
      # Not a dependency of the website; if this step fails the import runs without it.
      - name: Browser for vacancy pages built with JavaScript
        if: ${{ github.event.schedule != '23 6 * * *' && (inputs.task || 'sync') == 'sync' }}
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run task
        env:
          TASK: ${{ github.event.schedule == '23 6 * * *' && 'digest' || inputs.task || 'sync' }}
          MIGRATE: ${{ steps.ci.outputs.migrate }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Only for the "copy-database" task (moving the database, README): the new database's address.
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INOREADER_FEED_URLS: ${{ secrets.INOREADER_FEED_URLS }}
          ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_PRICE_MONTHLY: ${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_MONTHLY }}
          NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY: ${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY }}
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          # Only for the "ai-fill-trial" task (reads vacancy pages with DeepSeek; writes nothing).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret."; exit 1; fi
          if [ -z "$ANALYTICS_SALT" ] && [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET and ANALYTICS_SALT repository secrets (exactly the same values as on Netlify). Without them no trial marker can be written."
          fi
          if [ "$MIGRATE" = "true" ]; then
            # Safe to repeat: already-applied migrations are skipped.
            npm run db:migrate
          elif [ "$TASK" = "setup" ]; then
            echo "::error::Migrations were not applied: CI hasn't succeeded for this commit. Fix CI (or wait for it to finish), then run setup again."
            exit 1
          fi
          if [ "$TASK" = "setup" ]; then echo "Database is ready."; exit 0; fi
          echo "Running: $TASK"
          npm run "$TASK"
