# Runs the vacancy import every 2 hours and the emails once a day,
# directly against the database (no website time limits, works on any host).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   DATABASE_URL     same value as on your host
#   CRON_SECRET, ANALYTICS_SALT
#                    required; use exactly the same values on Netlify and in GitHub. They key
#                    the one-way trial markers written here and checked by the site (README Step 4).
#   SITE_URL         your site's address, e.g. https://postbirdjobs.com (used in email links)
#   RESEND_API_KEY   (optional until email is set up)
#   EMAIL_FROM       (optional) e.g. Postbird <alerts@yourdomain.com>
#   INOREADER_FEED_URLS (optional) same as on your host
#   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN, NEXT_PUBLIC_PADDLE_PRICE_MONTHLY, NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY
#                    (optional, once billing is live) same as on your host: the free
#                    weekly email then offers the free trial instead of early access
#   PADDLE_API_KEY, NEXT_PUBLIC_PADDLE_ENV
#                    (required once billing is live) same as on your host: the daily run
#                    cancels free trials at addresses nobody confirmed before they turn
#                    into a payment, and retries Paddle cancels that failed (README Step 4)
name: Scheduled jobs

on:
  schedule:
    - cron: "17 */2 * * *"   # import feeds every 2 hours (UTC)
    # Emails, daily 06:23 UTC: paid alerts (each subscriber's daily or weekly
    # choice is enforced in the code, so weekly subscribers get one email a
    # week) and the free weekly email, which starts on Mondays (UTC), or on
    # Tuesday or Wednesday if no run started it on Monday, and goes to each
    # free subscriber at most once per ISO week; later runs only retry a week
    # that started and failed.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: sync
        type: choice
        options: [sync, digest, setup, diagnose]

permissions:
  contents: read

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run task
        env:
          TASK: ${{ github.event.schedule == '23 6 * * *' && 'digest' || inputs.task || 'sync' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INOREADER_FEED_URLS: ${{ secrets.INOREADER_FEED_URLS }}
          ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_PRICE_MONTHLY: ${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_MONTHLY }}
          NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY: ${{ secrets.NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY }}
          NEXT_PUBLIC_PADDLE_ENV: ${{ secrets.NEXT_PUBLIC_PADDLE_ENV }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret."; exit 1; fi
          if [ -z "$ANALYTICS_SALT" ] && [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET and ANALYTICS_SALT repository secrets (exactly the same values as on Netlify). Without them no trial marker can be written."
          fi
          # Database tables are created or updated first (safe to repeat; already-applied steps are skipped).
          npm run db:migrate
          if [ "$TASK" = "setup" ]; then echo "Database is ready."; exit 0; fi
          echo "Running: $TASK"
          npm run "$TASK"
