# Runs the vacancy import every 2 hours and the weekly email every Monday,
# directly against the database (no website time limits, works on any host).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   DATABASE_URL     same value as on your host
#   SITE_URL         your site's address, e.g. https://postbirdjobs.com (used in email links)
#   RESEND_API_KEY   (optional until email is set up)
#   EMAIL_FROM       (optional) e.g. Postbird <alerts@yourdomain.com>
#   INOREADER_FEED_URLS (optional) same as on your host
name: Scheduled jobs

on:
  schedule:
    - cron: "17 */2 * * *"   # import feeds every 2 hours (UTC)
    - cron: "23 6 * * 1"     # weekly digest, Mondays 06:23 UTC
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: sync
        type: choice
        options: [sync, digest, setup]

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run task
        env:
          TASK: ${{ github.event.schedule == '23 6 * * 1' && 'digest' || inputs.task || 'sync' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          INOREADER_FEED_URLS: ${{ secrets.INOREADER_FEED_URLS }}
          ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret."; exit 1; fi
          # Database tables are created or updated first (safe to repeat; already-applied steps are skipped).
          npm run db:migrate
          if [ "$TASK" = "setup" ]; then echo "Database is ready."; exit 0; fi
          echo "Running: $TASK"
          npm run "$TASK"
