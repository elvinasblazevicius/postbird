# Runs the vacancy import every 2 hours and the weekly email every Monday.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://global-careers-hub.vercel.app  (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: Scheduled jobs

on:
  schedule:
    - cron: "17 */2 * * *"   # import feeds every 2 hours (UTC)
    - cron: "23 6 * * 1"     # weekly digest, Mondays 06:23 UTC
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: sync
        type: choice
        options: [sync, digest]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ github.event.schedule == '23 6 * * 1' && 'digest' || inputs.task || 'sync' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add SITE_URL and CRON_SECRET as repository secrets."; exit 1
          fi
          echo "Running $TASK on $SITE_URL"
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/$TASK"
          echo
