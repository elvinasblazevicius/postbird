# Netlify detects Next.js automatically; these settings just make it explicit.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secrets scan fails the build when a value marked secret appears in the output.
  # These three are public by design: Paddle.js needs the client-side token and the price IDs
  # in the browser to open checkout (README, billing section). Every other secret
  # (PADDLE_API_KEY, ADMIN_PASSWORD, CRON_SECRET, ANALYTICS_SALT, ...) is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_PADDLE_CLIENT_TOKEN,NEXT_PUBLIC_PADDLE_PRICE_MONTHLY,NEXT_PUBLIC_PADDLE_PRICE_QUARTERLY"

# Production builds apply database migrations first (scripts/build-netlify.sh).
# Deploy previews and branch deploys keep the plain build above.
[context.production]
  command = "bash scripts/build-netlify.sh"

# Public values built into the production pages. The Meta Pixel ID appears in the page source anyway;
# it loads only with advertising consent (src/lib/meta-pixel.ts). Production only, so deploy previews
# and branch deploys don't send test visits to the ad account. A value here wins over the Netlify UI.
[context.production.environment]
  NEXT_PUBLIC_META_PIXEL_ID = "678690642892717"
